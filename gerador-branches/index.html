<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerador de branches - Ferramentas Dev</title>
<link rel="stylesheet" href="../menu.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <a href="../" class="voltar">&larr; Ferramentas Dev</a>
  <h1>Gerador de branches - Winthor</h1>
  <p class="sub">Gera os nomes das branches com base no calendário de versões e nas regras do ERP.</p>
</header>

<main>
  <form id="form" class="painel" autocomplete="off">
    <div class="linha">
      <label>Número do Jira
        <input type="text" id="jira" placeholder="Ex: DDESTOQUE-37406" required>
      </label>
      <label>Tipo de tarefa/fluxo
        <select id="tipo">
          <option value="feature">História / Feature (nova implementação)</option>
          <option value="bugfix">Manutenção / Bugfix (correção)</option>
          <option value="hotfix">Bug / Hotfix (execução na própria tarefa)</option>
        </select>
      </label>
    </div>

    <div class="caixa">
      <label>Escopo do repositório
        <select id="escopo">
          <option value="rotina">Rotina (depende da rotina)</option>
          <option value="db">DB (repositório ADMDB-pkg)</option>
        </select>
      </label>

      <div class="versoes">
        <div class="ver-topo">
          <strong>Versões correntes</strong>
          <small>Códigos numéricos (ex: 370 para 37.0). Deixe a Release vazia se não houver.</small>
        </div>
        <div class="linha4">
          <label>Suporte <input type="number" id="verSup"></label>
          <label>Master / Main <input type="number" id="verMas"></label>
          <label>Release (opcional) <input type="number" id="verRel"></label>
          <label>Develop <input type="number" id="verDev"></label>
        </div>
        <p class="info" id="infoVersoes"></p>
        <div class="acoes">
          <button type="button" class="btn peq" id="salvarVersoes">Salvar versões</button>
          <button type="button" class="btn peq" id="usarCalendario">Usar calendário do mês</button>
        </div>
      </div>

      <div class="arquivo">
        <p class="status" id="statusArquivo"></p>
        <div class="acoes">
          <button type="button" class="btn peq" id="btnArqCriar" hidden title="Cria um arquivo .json no computador onde as versões serão salvas">Criar arquivo de configuração</button>
          <button type="button" class="btn peq" id="btnArqAbrir" hidden title="Usa um arquivo .json que já existe">Usar arquivo existente</button>
          <button type="button" class="btn peq pri" id="btnArqReconectar" hidden>Reconectar arquivo</button>
          <button type="button" class="btn peq link" id="btnArqDesvincular" hidden>Desvincular arquivo</button>
        </div>
      </div>
    </div>

    <p class="erro" id="erro" hidden></p>

    <div class="acoes">
      <button type="submit" class="btn pri">Gerar branches</button>
      <button type="button" class="btn" id="limpar">Limpar</button>
    </div>
  </form>

  <section id="resultado" class="painel" hidden>
    <div class="res-topo">
      <h2>Branches geradas</h2>
      <button type="button" class="btn peq" id="copiarTodas">Copiar todas</button>
    </div>
    <div id="lista"></div>
  </section>
</main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
